<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
        font-family: sans-serif; 
        text-align: center; 
        color: #333; 
        background-color: #f8f9fa;
        margin: 0;
        padding-top: 15px;
    }
    h2 { margin: 5px 0; }
    .instructions { font-size: 14px; margin-bottom: 5px; color: #666; }
    
    #gameContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    /* HORIZONTAL CONTROL BOX */
    #controlsBox {
        background-color: #333;
        color: white;
        padding: 10px 20px;
        border-radius: 8px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin-bottom: 15px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 960px; 
        box-sizing: border-box;
    }

    .control-item {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 18px;
        font-weight: bold;
    }

    /* RESIZABLE WRAPPER FOR THE CANVAS */
    #canvasWrapper {
        resize: both;
        overflow: hidden;
        width: 960px;
        height: 1160px;
        min-width: 600px;
        min-height: 500px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        border-radius: 8px;
        background-color: #1e1e1e;
        position: relative;
        margin-bottom: 30px;
    }

    #shapeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .level-btn {
      background-color: #555;
      color: white;
      border: none;
      border-radius: 4px;
      width: 30px;
      height: 30px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .level-btn:hover { background-color: #777; }
    .level-btn:active { background-color: #999; }

    .action-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    
    .action-btn:hover { background-color: #45a049; }

    .reset-btn { background-color: #E53935; }
    .reset-btn:hover { background-color: #d32f2f; }
    
  </style>
</head>
<body>
  <h2>Shape Hunter Match</h2>
  <div class="instructions">
    Look at the <strong>2 Targets at the top</strong>. Click their matches in the moving field below!
  </div>
  
  <div id="gameContainer">
    <div id="controlsBox">
      <div class="control-item">
        <button id="actionBtn" class="action-btn" onclick="togglePlayPause()">Start</button>
        <button class="action-btn reset-btn" onclick="handleStopClick()">Stop</button>
      </div>
      <div class="control-item">
        Timer Setup: 
        <button class="level-btn" onclick="changeTimeSetting(-10)">-</button>
        <span id="timeSettingDisplay" style="min-width: 35px; text-align: center;">30</span>
        <button class="level-btn" onclick="changeTimeSetting(10)">+</button>
      </div>
      <div class="control-item">
        Time Left: <span id="timeDisplay" style="color: #FFD700; min-width: 35px; text-align: center;">30</span>
      </div>
      <div class="control-item">
        Score: <span id="scoreDisplay" style="color: #4CAF50; min-width: 30px; text-align: center;">0</span>
      </div>
      <div class="control-item">
        Level: 
        <button class="level-btn" onclick="changeLevel(-1)">-</button>
        <span id="levelDisplay" style="min-width: 25px; text-align: center;">5</span>
        <button class="level-btn" onclick="changeLevel(1)">+</button>
      </div>
    </div>

    <!-- The Resizable container -->
    <div id="canvasWrapper">
        <canvas id="shapeCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("shapeCanvas");
    const ctx = canvas.getContext("2d");

    // Adjusted Colors (True Orange & Pure Yellow)
    const colors = [
        "#007AFF", // Blue
        "#FF0000", // Red 
        "#FFFF00", // Pure Yellow
        "#34C759", // Green
        "#8B4513", // Brown
        "#FFA500", // Pure Vibrant Orange
        "#9C27B0", // Purple
        "#FFFFFF"  // White
    ];
    
    const shapes = ["square", "rectangle", "triangle", "octagon", "hexagon", "circle"];
    
    // 48 Total Combinations
    const allCombos = [];
    for (let s of shapes) {
        for (let c of colors) {
            allCombos.push({shape: s, color: c});
        }
    }

    const NUM_SHAPES = 12; 
    const SHAPE_SIZE = 66; // Increased by 10%
    const FIELD_MIN_Y = 180;
    
    let FIELD_MAX_Y = 1160 - SHAPE_SIZE; // Will dynamically update on resize

    let activeItems = [];
    let score = 0;
    let currentLevel = 5; 

    // Target Initialization 
    let target1 = {shape: allCombos[0].shape, color: allCombos[0].color, found: false};
    let target2 = {shape: allCombos[1].shape, color: allCombos[1].color, found: false};
    let targetsTimeToUpdate = 0;
    let forceTargetReset = true;
    let celebrating = false; 

    let gameState = 'STOPPED';
    let lastRealTime = performance.now();
    let gameTime = 0; 
    
    let timeSetting = 30; 
    let timeLeft = 30;    
    let timeInterval = null;

    // --- RESIZE OBSERVER (Listens to bottom corner dragging) ---
    const canvasWrapper = document.getElementById("canvasWrapper");
    const resizeObserver = new ResizeObserver(entries => {
        for (let entry of entries) {
            // Internal canvas pixels sync perfectly with HTML container size
            canvas.width = entry.contentRect.width;
            canvas.height = entry.contentRect.height;
            FIELD_MAX_Y = canvas.height - SHAPE_SIZE;
        }
    });
    resizeObserver.observe(canvasWrapper);

    // --- AUDIO SYSTEM ---
    let audioCtx;
    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        initAudio();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'positive') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
            oscillator.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.05); 
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15);
            
        } else if (type === 'win') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
            oscillator.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); 

            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.6);

        } else if (type === 'negative') {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.2);
            
        } else if (type === 'timeout_win') {
            // New Happy Arpeggio if Score > 0 at End Game!
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(392.00, audioCtx.currentTime);       // G4
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.1); // C5
            oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2); // E5
            oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3); // G5
            oscillator.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.4);// C6

            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.8);
        }
    }

    // --- UI CONTROLS ---
    function togglePlayPause() {
        const btn = document.getElementById("actionBtn");
        
        if (gameState === 'STOPPED') {
            gameState = 'PLAYING';
            score = 0;
            document.getElementById('scoreDisplay').innerText = score;
            timeLeft = timeSetting;
            document.getElementById('timeDisplay').innerText = timeLeft;
            forceTargetReset = true;
            
            activeItems = [];
            for (let i = 0; i < NUM_SHAPES; i++) {
                let combo = getRandomCombo(i);
                let pos = getValidPosition(i);
                activeItems.push({
                    shape: combo.shape,
                    color: combo.color,
                    x: pos.x,
                    y: pos.y,
                    timeToUpdate: gameTime + (Math.random() * 2000),
                    found: false
                });
            }
            
            btn.innerText = "Pause";
            btn.style.backgroundColor = "#ff9800"; 
            initAudio();
            startTimer();
            
        } else if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
            btn.innerText = "Continue";
            btn.style.backgroundColor = "#4CAF50"; 
            clearInterval(timeInterval);
            
        } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
            btn.innerText = "Pause";
            btn.style.backgroundColor = "#ff9800"; 
            startTimer();
        }
    }

    function handleStopClick() {
        stopGame(false); // Manual stop, does not trigger win sound
    }

    function stopGame(isTimeout = false) {
        gameState = 'STOPPED';
        clearInterval(timeInterval);
        
        const btn = document.getElementById("actionBtn");
        btn.innerText = "Start";
        btn.style.backgroundColor = "#4CAF50"; 
        
        timeLeft = timeSetting;
        document.getElementById('timeDisplay').innerText = timeLeft;
        activeItems = []; 
        
        if (isTimeout && score > 0) {
            playSound('timeout_win'); // Happy Sound!
        }
    }

    function startTimer() {
        clearInterval(timeInterval);
        timeInterval = setInterval(() => {
            if(gameState !== 'PLAYING') return;
            timeLeft--;
            document.getElementById('timeDisplay').innerText = timeLeft;
            if (timeLeft <= 0) {
                stopGame(true); // Flag true because it was a timeout
            }
        }, 1000);
    }

    function changeTimeSetting(diff) {
        if (gameState !== 'STOPPED') return; 
        timeSetting += diff;
        if (timeSetting < 10) timeSetting = 10;
        if (timeSetting > 120) timeSetting = 120;
        document.getElementById("timeSettingDisplay").innerText = timeSetting;
        
        timeLeft = timeSetting;
        document.getElementById("timeDisplay").innerText = timeLeft;
    }

    function changeLevel(change) {
        currentLevel += change;
        if (currentLevel < 1) currentLevel = 1;
        if (currentLevel > 10) currentLevel = 10;
        document.getElementById("levelDisplay").innerText = currentLevel;
    }

    function getSpeedMultiplier() {
        if (currentLevel === 5) return 1.0;
        if (currentLevel > 5) return Math.pow(0.85, currentLevel - 5);
        else return Math.pow(1.15, 5 - currentLevel);
    }

    // --- DRAWING FUNCTIONS ---
    function drawPolygon(ctx, x, y, radius, sides) {
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
            const angle = i * 2 * Math.PI / sides - Math.PI / 2; 
            ctx.lineTo(x + radius * Math.cos(angle), y + radius * Math.sin(angle));
        }
        ctx.closePath();
        ctx.fill();
    }

    function drawShape(type, color, x, y) {
        ctx.fillStyle = color;
        const size = SHAPE_SIZE;
        
        if (type === "square") {
            ctx.fillRect(x - size/2, y - size/2, size, size);
        } else if (type === "rectangle") {
            ctx.fillRect(x - (size*0.75), y - (size*0.45), size*1.5, size*0.9);
        } else if (type === "circle") {
            ctx.beginPath();
            ctx.arc(x, y, size/2, 0, Math.PI * 2);
            ctx.fill();
        } else if (type === "triangle") {
            drawPolygon(ctx, x, y + size/6, size/1.6, 3);
        } else if (type === "hexagon") {
            drawPolygon(ctx, x, y, size/1.75, 6);
        } else if (type === "octagon") {
            let r = size / 1.5; 
            ctx.beginPath();
            ctx.moveTo(x, y - r);
            ctx.lineTo(x + r*0.866, y + r*0.5);
            ctx.lineTo(x - r*0.866, y + r*0.5);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x, y + r);
            ctx.lineTo(x + r*0.866, y - r*0.5);
            ctx.lineTo(x - r*0.866, y - r*0.5);
            ctx.closePath();
            ctx.fill();
        }
    }

    // --- GRID GENERATION ---
    function getRandomCombo(excludeIndex) {
        let usedCombos = activeItems
            .filter((item, idx) => idx !== excludeIndex && item.shape && item.color)
            .map(item => item.shape + item.color);
            
        let availableCombos = allCombos.filter(c => !usedCombos.includes(c.shape + c.color));
        return availableCombos[Math.floor(Math.random() * availableCombos.length)];
    }

    // Massive Spreading Algorithm
    function getValidPosition(excludeIndex) {
        let attempts = 0;
        // Require a huge distance to prevent clumping (200px vs old 85px)
        let currentMinDist = 200; 
        
        // Dynamic Range Protection for resized windows
        let rxRange = Math.max(10, canvas.width - SHAPE_SIZE * 3);
        let ryRange = Math.max(10, FIELD_MAX_Y - FIELD_MIN_Y - SHAPE_SIZE * 3);
        
        while (attempts < 250) {
            if (attempts > 50) currentMinDist *= 0.95; // Gently lower requirements if a spot is hard to find
            
            let rx = (SHAPE_SIZE * 1.5) + Math.random() * rxRange;
            let ry = FIELD_MIN_Y + (SHAPE_SIZE * 1.5) + Math.random() * ryRange;
            
            let overlap = false;
            for (let i = 0; i < activeItems.length; i++) {
                if (i === excludeIndex) continue; 
                if (!activeItems[i].x) continue;  
                
                let dx = rx - activeItems[i].x;
                let dy = ry - activeItems[i].y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < currentMinDist) {
                    overlap = true;
                    break;
                }
            }
            if (!overlap) return {x: rx, y: ry};
            attempts++;
        }
        return {x: canvas.width/2, y: FIELD_MIN_Y + 100}; 
    }

    // --- CLICK EVENTS ---
    canvas.addEventListener('mousedown', function(event) {
        if (gameState !== 'PLAYING' || celebrating) return; 

        initAudio();
        const rect = canvas.getBoundingClientRect();
        const clickX = (event.clientX - rect.left) * (canvas.width / rect.width);
        const clickY = (event.clientY - rect.top) * (canvas.height / rect.height);

        let hitCorrect = false;

        for (let i = 0; i < activeItems.length; i++) {
            let item = activeItems[i];
            let dx = clickX - item.x;
            let dy = clickY - item.y;
            
            // Adjusted click-radius for the 10% larger shapes
            if (Math.sqrt(dx*dx + dy*dy) < 45) {
                if (!target1.found && item.shape === target1.shape && item.color === target1.color) {
                    target1.found = true;
                    item.found = true;
                    hitCorrect = true;
                }
                else if (!target2.found && item.shape === target2.shape && item.color === target2.color) {
                    target2.found = true;
                    item.found = true;
                    hitCorrect = true;
                }
                break; 
            }
        }

        if (target1.found && target2.found) {
            playSound('win'); 
            celebrating = true;
            score++;
            document.getElementById('scoreDisplay').innerHTML = score;
            
            setTimeout(() => {
                forceTargetReset = true; 
                celebrating = false;
                activeItems.forEach(item => item.found = false);
            }, 500); 
            
        } else if (hitCorrect) {
            playSound('positive'); 
        } else {
            playSound('negative'); 
        }
    });

    function drawTarget(target, x, y) {
        if (target.found) {
            ctx.beginPath();
            ctx.arc(x, y, SHAPE_SIZE - 2, 0, Math.PI*2); // Halo tweaked for new shape size
            ctx.fillStyle = "rgba(76, 175, 80, 0.4)";
            ctx.fill();
            ctx.strokeStyle = "#4CAF50";
            ctx.lineWidth = 4;
            ctx.stroke();
        }
        drawShape(target.shape, target.color, x, y);
    }

    // --- MAIN ANIMATION LOOP ---
    function animate(timestamp) {
        let deltaTime = timestamp - lastRealTime;
        lastRealTime = timestamp;
        
        if (gameState === 'PLAYING') {
            gameTime += deltaTime;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        let speedMultiplier = getSpeedMultiplier();

        // 1. Top Area UI 
        ctx.fillStyle = "#2c2c2c";
        ctx.fillRect(0, 0, canvas.width, 140); 
        ctx.fillStyle = "#555";
        ctx.fillRect(0, 140, canvas.width, 4); 

        ctx.fillStyle = "#ddd";
        ctx.font = "bold 20px Arial";
        ctx.textAlign = "left";
        ctx.fillText("FIND THESE TWO:", 20, 80);

        // Position adjusts smoothly with Resizing
        drawTarget(target1, canvas.width/2 - 80, 70);
        drawTarget(target2, canvas.width/2 + 80, 70);

        // 2. Logic & Drawing 
        if (gameState === 'STOPPED') {
            // Draw 48 Shapes, Dynamically filling whichever container size user sets
            let cols = 8;
            let rows = 6;
            let xSpacing = canvas.width / cols;
            let ySpacing = (FIELD_MAX_Y - FIELD_MIN_Y) / rows;

            for (let i = 0; i < allCombos.length; i++) {
                let col = i % cols;
                let row = Math.floor(i / cols);
                let cx = (xSpacing / 2) + col * xSpacing;
                let cy = FIELD_MIN_Y + (ySpacing / 2) + row * ySpacing;
                drawShape(allCombos[i].shape, allCombos[i].color, cx, cy);
            }

        } else {
            // Dynamic Spreading Game Area
            if (gameState === 'PLAYING' && (gameTime > targetsTimeToUpdate || forceTargetReset)) {
                forceTargetReset = false;
                
                let idx1 = Math.floor(Math.random() * NUM_SHAPES);
                let idx2 = Math.floor(Math.random() * NUM_SHAPES);
                while (idx1 === idx2) {
                    idx2 = Math.floor(Math.random() * NUM_SHAPES);
                }

                target1 = { shape: activeItems[idx1].shape, color: activeItems[idx1].color, found: false };
                target2 = { shape: activeItems[idx2].shape, color: activeItems[idx2].color, found: false };

                let baseDuration = 2500 + Math.random() * 1500;
                let finalDuration = baseDuration * speedMultiplier;
                targetsTimeToUpdate = gameTime + finalDuration;

                activeItems[idx1].timeToUpdate = gameTime + finalDuration + 500;
                activeItems[idx2].timeToUpdate = gameTime + finalDuration + 500;
            }

            for (let i = 0; i < activeItems.length; i++) {
                let item = activeItems[i];
                
                if (gameState === 'PLAYING' && !celebrating && gameTime > item.timeToUpdate && !item.found) {
                    let newCombo = getRandomCombo(i);
                    let newPos = getValidPosition(i);
                    
                    item.shape = newCombo.shape;
                    item.color = newCombo.color;
                    item.x = newPos.x;
                    item.y = newPos.y;
                    
                    let baseJumpDelay = 1000 + Math.random() * 2000;
                    item.timeToUpdate = gameTime + (baseJumpDelay * speedMultiplier);
                }
                
                if (!item.found) {
                    drawShape(item.shape, item.color, item.x, item.y);
                }
            }

            for (let i = 0; i < activeItems.length; i++) {
                let item = activeItems[i];
                if (item.found) {
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, SHAPE_SIZE - 2, 0, Math.PI*2);
                    ctx.fillStyle = "rgba(76, 175, 80, 0.4)";
                    ctx.fill();
                    ctx.strokeStyle = "#4CAF50";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    drawShape(item.shape, item.color, item.x, item.y);
                }
            }
        }

        requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
