<!DOCTYPE html>
<html>
<head>
  <style>
    body { 
        font-family: sans-serif; 
        text-align: center; 
        color: #333; 
        background-color: #f8f9fa;
        margin: 0;
        padding-top: 15px;
    }
    h2 { margin: 5px 0; font-size: 32px; }
    .instructions { font-size: 18px; margin-bottom: 10px; color: #666; }
    
    #gameContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
    }

    #controlsBox {
        background-color: #1e1e1e;
        color: white;
        padding: 20px 0px 0px 0px; 
        border-radius: 8px 8px 0 0; 
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 0px; 
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        width: 960px; 
        box-sizing: border-box;
    }

    .top-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end; 
        width: 100%;
        padding: 0 20px;
        box-sizing: border-box;
    }

    .sky-panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: #555; 
        padding: 15px 20px; 
        border-radius: 0px; 
        box-shadow: inset 0px 2px 5px rgba(0,0,0,0.5);
        gap: 15px;
        width: 100%;
        box-sizing: border-box;
    }

    .stats-row {
        display: flex;
        justify-content: space-around;
        align-items: center;
        width: 100%;
        font-size: 36px;
        font-weight: bold;
        color: #FFFFFF;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8); 
    }
    
    .targets-row {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        width: 100%;
    }

    .target-text-container {
        justify-self: start;
        padding-left: 10px; 
    }

    .target-shapes-container {
        justify-self: center;
        display: flex;
        gap: 30px;
    }

    .target-text {
        font-size: 30px;
        font-weight: bold;
        color: #FFFFFF; 
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }

    .control-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    .left-group { align-items: flex-start; }
    .center-group { align-items: center; }
    .right-group { align-items: flex-end; }

    .btn-row {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .label {
        font-size: 16px;
        color: #aaa;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    #canvasWrapper {
        resize: both;
        overflow: hidden;
        width: 960px;
        height: 1020px; 
        min-width: 600px;
        min-height: 500px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        border-radius: 0 0 8px 8px; 
        background-color: #1e1e1e;
        position: relative;
        margin-bottom: 30px;
        touch-action: none; /* Prevents iPhone screen dragging while tapping */
    }

    #shapeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* MESSAGE OVERLAY */
    #messageOverlay {
        display: none; 
        position: absolute; 
        top: 50%; left: 50%; 
        transform: translate(-50%, -50%); 
        width: 60%; 
        height: 40%; 
        background: linear-gradient(to bottom, #87CEEB, #e0f6ff); 
        border: 4px solid white; 
        border-radius: 12px; 
        text-align: center; 
        flex-direction: column; 
        justify-content: center; 
        align-items: center; 
        gap: 20px; 
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
        z-index: 10;
        text-shadow: none;
    }

    .level-btn {
      background-color: #555;
      color: white;
      border: none;
      border-radius: 6px;
      width: 45px;  
      height: 45px; 
      font-size: 30px; 
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .level-btn:hover { background-color: #777; }
    .level-btn:active { background-color: #999; }

    .action-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 24px; 
      font-size: 24px;    
      font-weight: bold;
      cursor: pointer;
    }
    
    .action-btn:hover { background-color: #45a049; }

    .stop-btn { background-color: #FF9800; }
    .stop-btn:hover { background-color: #e68a00; }

    .reset-btn { background-color: #E53935; }
    .reset-btn:hover { background-color: #d32f2f; }
    
  </style>
</head>
<body>
  <h2>Shape Hunter Match</h2>
  <div class="instructions">
    Look at the <strong>2 Targets</strong> in the banner. Click their matches in the moving field below!
  </div>
  
  <div id="gameContainer">
    <div id="controlsBox">
      
      <div class="top-row">
        <div class="control-group left-group">
          <div class="btn-row">
            <button id="actionBtn" class="action-btn" onclick="handleStartResume()">Start</button>
            <button id="stopBtn" class="action-btn stop-btn" onclick="handleStop()">Stop</button>
            <button id="resetBtn" class="action-btn reset-btn" onclick="handleReset()">Reset</button>
          </div>
        </div>

        <div class="control-group center-group">
          <div class="label">Level</div>
          <div class="btn-row">
            <button class="level-btn" onclick="changeLevel(-1)">-</button>
            <span id="levelDisplay" style="min-width: 35px; text-align: center; font-size: 28px; font-weight: bold;">1</span>
            <button class="level-btn" onclick="changeLevel(1)">+</button>
          </div>
        </div>

        <div class="control-group right-group">
          <div class="label">Time Setup</div>
          <div class="btn-row">
            <button class="level-btn" onclick="changeTimeSetting(-10)">-</button>
            <span id="timeSettingDisplay" style="min-width: 45px; text-align: center; font-size: 28px; font-weight: bold;">30</span>
            <button class="level-btn" onclick="changeTimeSetting(10)">+</button>
          </div>
        </div>
      </div>

      <div class="sky-panel">
        <div class="stats-row">
            <div>Score: <span id="scoreDisplay" style="color: #4CAF50;">0</span></div>
            <div>Time Left: <span id="timeDisplay" style="color: #4CAF50;">30</span></div>
            <div>Target: <span id="targetDisplay" style="color: #4CAF50;">0</span></div>
        </div>
        <div class="targets-row">
            <div class="target-text-container">
                <span class="target-text">FIND THESE TWO:</span>
            </div>
            <div class="target-shapes-container">
                <canvas id="t1Canvas" width="90" height="90"></canvas>
                <canvas id="t2Canvas" width="90" height="90"></canvas>
            </div>
            <div></div> 
        </div>
      </div>

    </div>

    <div id="canvasWrapper">
        <canvas id="shapeCanvas"></canvas>
        
        <div id="messageOverlay">
            <h2 id="msgTitle" style="color: #333; margin: -20px 0 10px 0; font-size: 57px;"></h2>
            <div id="msgLine1" style="font-size: 39px; color: #333; margin: 5px 0;"></div>
            <div id="msgLine2" style="font-size: 39px; color: #333; margin: 5px 0 15px 0;"></div>
            <button id="msgBtn" onclick="handleOverlayBtn()" class="action-btn" style="padding: 15px 30px; font-size: 36px; cursor: pointer;"></button>
        </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("shapeCanvas");
    const ctx = canvas.getContext("2d");

    const colors = [
        "#007AFF", "#FF0000", "#FFFF00", "#34C759", 
        "#00FFFF", "#FFA500", "#9C27B0", "#FFFFFF"
    ];
    
    const shapes = ["square", "rectangle", "triangle", "octagon", "pentagon", "circle"];
    
    const allCombos = [];
    for (let s of shapes) {
        for (let c of colors) {
            allCombos.push({shape: s, color: c});
        }
    }

    const LEVEL_DURATIONS_MS = [5000, 4400, 3900, 3400, 3000, 2700, 2600, 2500, 2500, 2400];
    const LEVEL_BASE_TARGETS = [5, 6, 7, 7, 8, 9, 9, 9, 10, 10];

    const NUM_SHAPES = 12; 
    const SHAPE_SIZE = 66; 
    
    const FIELD_MIN_Y = 20;
    let FIELD_MAX_Y = 1020 - SHAPE_SIZE; 

    let activeItems = [];
    
    let overallScore = 0; 
    let levelScore = 0;   
    let currentLevel = 1; 
    
    let levelTarget = 0;

    let target1 = {shape: allCombos[0].shape, color: allCombos[0].color, found: false};
    let target2 = {shape: allCombos[1].shape, color: allCombos[1].color, found: false};
    
    let lastTarget1Combo = ""; 
    let lastTarget2Combo = ""; 

    let targetsTimeToUpdate = 0;
    let forceTargetReset = true;
    let celebrating = false; 

    let gameState = 'STOPPED'; 
    let lastRealTime = performance.now();
    let gameTime = 0; 
    
    let timeSetting = 30; 
    let timeLeft = 30;    
    let timeInterval = null;

    let particles = []; 
    let clickEffects = []; // Stores the visual click feedback

    const canvasWrapper = document.getElementById("canvasWrapper");
    const controlsBox = document.getElementById("controlsBox");
    const resizeObserver = new ResizeObserver(entries => {
        for (let entry of entries) {
            canvas.width = entry.contentRect.width;
            canvas.height = entry.contentRect.height;
            FIELD_MAX_Y = canvas.height - SHAPE_SIZE;
            controlsBox.style.width = entry.contentRect.width + "px";
        }
    });
    resizeObserver.observe(canvasWrapper);

    // --- AUDIO SYSTEM ---
    let audioCtx;
    let happyPlaying = false;
    let happyInterval = null;

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        initAudio();
        let t = audioCtx.currentTime;

        if (type === 'positive' || type === 'win') {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, t); 
            oscillator.frequency.setValueAtTime(1108.73, t + 0.05); 
            
            gainNode.gain.setValueAtTime(0.1, t);
            gainNode.gain.linearRampToValueAtTime(0, t + 0.15);
            
            oscillator.start(t);
            oscillator.stop(t + 0.15);
            
        } else if (type === 'negative') {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(200, t);
            oscillator.frequency.linearRampToValueAtTime(100, t + 0.6);
            
            gainNode.gain.setValueAtTime(0.2, t);
            gainNode.gain.linearRampToValueAtTime(0, t + 0.6);
            
            oscillator.start(t);
            oscillator.stop(t + 0.6);

        } else if (type === 'level_fail') {
            let osc1 = audioCtx.createOscillator();
            let gain1 = audioCtx.createGain();
            osc1.type = 'sawtooth';
            osc1.frequency.setValueAtTime(300, t);
            gain1.gain.setValueAtTime(0.3, t);
            gain1.gain.linearRampToValueAtTime(0, t + 0.4);
            osc1.connect(gain1).connect(audioCtx.destination);
            osc1.start(t); 
            osc1.stop(t + 0.4);

            let osc2 = audioCtx.createOscillator();
            let gain2 = audioCtx.createGain();
            osc2.type = 'sawtooth';
            osc2.frequency.setValueAtTime(250, t + 0.4);
            gain2.gain.setValueAtTime(0.3, t + 0.4);
            gain2.gain.linearRampToValueAtTime(0, t + 0.8);
            osc2.connect(gain2).connect(audioCtx.destination);
            osc2.start(t + 0.4); 
            osc2.stop(t + 0.8);

            let osc3 = audioCtx.createOscillator();
            let gain3 = audioCtx.createGain();
            osc3.type = 'sawtooth';
            osc3.frequency.setValueAtTime(200, t + 0.8);
            gain3.gain.setValueAtTime(0.3, t + 0.8);
            gain3.gain.linearRampToValueAtTime(0, t + 2.5);
            osc3.connect(gain3).connect(audioCtx.destination);
            osc3.start(t + 0.8); 
            osc3.stop(t + 2.5);
        }
    }

    function playLoopingHappySound() {
        if (happyPlaying) return;
        initAudio();
        happyPlaying = true;
        let i = 0;
        let sequence = [523.25, 659.25, 783.99, 1046.50]; 
        
        function playNote() {
            if (!happyPlaying) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(sequence[i % sequence.length], audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            
            osc.start(audioCtx.currentTime);
            osc.stop(audioCtx.currentTime + 0.2);
            
            i++;
            happyInterval = setTimeout(playNote, 250);
        }
        playNote();
    }

    function stopLoopingHappySound() {
        happyPlaying = false;
        clearTimeout(happyInterval);
    }

    // --- OVERLAY & UI CONTROLS ---
    function showOverlay(title, line1, line2, btnText) {
        document.getElementById('msgTitle').innerText = title;
        document.getElementById('msgLine1').innerText = line1;
        document.getElementById('msgLine2').innerText = line2;
        document.getElementById('msgBtn').innerText = btnText;
        document.getElementById('messageOverlay').style.display = 'flex';
    }

    function handleOverlayBtn() {
        document.getElementById('messageOverlay').style.display = 'none';
        stopLoopingHappySound();
        
        if (gameState === 'LEVEL_END_WIN') {
            currentLevel++;
            if (currentLevel > 10) currentLevel = 1; 
        }
        
        gameState = 'STOPPED';
        levelScore = 0;
        timeLeft = timeSetting;
        particles = []; 
        clickEffects = []; // clear old clicks
        lastTarget1Combo = "";
        lastTarget2Combo = "";
        
        document.getElementById('levelDisplay').innerText = currentLevel;
        document.getElementById('scoreDisplay').innerText = overallScore + levelScore;
        document.getElementById('timeDisplay').innerText = timeLeft;
        calculateLevelTarget();
        
        activeItems = [];
        forceTargetReset = true;
        document.getElementById("actionBtn").innerText = "Start";
        
        handleStartResume(); 
    }

    function calculateLevelTarget() {
        let baseTgt = LEVEL_BASE_TARGETS[currentLevel - 1];
        levelTarget = Math.max(1, Math.round(baseTgt * (timeSetting / 30)));
        let seconds = (LEVEL_DURATIONS_MS[currentLevel - 1] / 1000).toFixed(1);
        document.getElementById('targetDisplay').innerText = `${levelTarget} @ ${seconds}`;
    }

    function handleStartResume() {
        if (gameState === 'LEVEL_END_WIN' || gameState === 'LEVEL_END_LOSE') {
            document.getElementById('messageOverlay').style.display = 'none';
            stopLoopingHappySound();
            particles = [];
            clickEffects = [];
            
            if (gameState === 'LEVEL_END_WIN') {
                currentLevel++;
                if (currentLevel > 10) currentLevel = 1;
            }
            gameState = 'STOPPED';
            levelScore = 0;
            document.getElementById('levelDisplay').innerText = currentLevel;
            calculateLevelTarget();
        }

        if (gameState === 'PLAYING') return;
        
        if (gameState === 'STOPPED') {
            levelScore = 0;
            timeLeft = timeSetting;
            document.getElementById('scoreDisplay').innerText = overallScore + levelScore;
            document.getElementById('timeDisplay').innerText = timeLeft;
            forceTargetReset = true;
            lastTarget1Combo = "";
            lastTarget2Combo = "";
            
            calculateLevelTarget();
            
            activeItems = [];
            for (let i = 0; i < NUM_SHAPES; i++) {
                let combo = getRandomCombo(i);
                let pos = getValidPosition(i);
                activeItems.push({
                    shape: combo.shape,
                    color: combo.color,
                    x: pos.x,
                    y: pos.y,
                    timeToUpdate: gameTime + (Math.random() * 2000),
                    found: false
                });
            }
        }
        
        gameState = 'PLAYING';
        document.getElementById("actionBtn").innerText = "Start";
        initAudio();
        startTimer();
    }

    function handleStop() {
        if (gameState !== 'PLAYING') return;
        gameState = 'PAUSED';
        clearInterval(timeInterval);
        document.getElementById("actionBtn").innerText = "Resume";
    }

    function handleReset() {
        document.getElementById('messageOverlay').style.display = 'none';
        stopLoopingHappySound();
        particles = [];
        clickEffects = [];
        gameState = 'STOPPED';
        clearInterval(timeInterval);
        
        currentLevel = 1;
        overallScore = 0;
        levelScore = 0;
        timeLeft = timeSetting;
        lastTarget1Combo = "";
        lastTarget2Combo = "";
        
        document.getElementById('levelDisplay').innerText = currentLevel;
        document.getElementById('scoreDisplay').innerText = overallScore;
        document.getElementById('timeDisplay').innerText = timeLeft;
        document.getElementById("actionBtn").innerText = "Start";
        
        calculateLevelTarget();
        activeItems = [];
    }

    function startTimer() {
        clearInterval(timeInterval);
        timeInterval = setInterval(() => {
            if(gameState !== 'PLAYING') return;
            timeLeft--;
            document.getElementById('timeDisplay').innerText = timeLeft;
            
            if (timeLeft <= 0) {
                gameState = 'STOPPED';
                clearInterval(timeInterval);
                document.getElementById("actionBtn").innerText = "Start";
                
                let finalLevelScore = levelScore; 
                
                if (finalLevelScore >= levelTarget) {
                    gameState = 'LEVEL_END_WIN';
                    overallScore += finalLevelScore; 
                    document.getElementById('scoreDisplay').innerText = overallScore;
                    
                    showOverlay("You Won!", `Level score was: ${finalLevelScore}`, `Challenge was: ${levelTarget}`, `Continue To Level ${currentLevel + 1}`);
                    playLoopingHappySound();
                } else {
                    gameState = 'LEVEL_END_LOSE';
                    levelScore = 0; 
                    document.getElementById('scoreDisplay').innerText = overallScore;
                    
                    showOverlay("You Failed", `Level score was: ${finalLevelScore}`, `Level ${currentLevel} Target was: ${levelTarget}`, `Replay Level ${currentLevel}`);
                    playSound('level_fail');
                }
            }
        }, 1000);
    }

    function changeTimeSetting(diff) {
        if (gameState !== 'STOPPED') return;
        timeSetting += diff;
        if (timeSetting < 10) timeSetting = 120; 
        if (timeSetting > 120) timeSetting = 10;
        document.getElementById("timeSettingDisplay").innerText = timeSetting;
        timeLeft = timeSetting;
        document.getElementById("timeDisplay").innerText = timeLeft;
        calculateLevelTarget(); 
    }

    function changeLevel(change) {
        if (gameState !== 'STOPPED') return;
        currentLevel += change;
        if (currentLevel < 1) currentLevel = 10;
        if (currentLevel > 10) currentLevel = 1;
        document.getElementById("levelDisplay").innerText = currentLevel;
        calculateLevelTarget(); 
    }

    function getSpeedMultiplier() {
        return LEVEL_DURATIONS_MS[currentLevel - 1] / 3000;
    }

    // --- DRAWING FUNCTIONS ---
    function drawPolygonCtx(context, x, y, radius, sides) {
        context.beginPath();
        for (let i = 0; i < sides; i++) {
            const angle = i * 2 * Math.PI / sides - Math.PI / 2; 
            context.lineTo(x + radius * Math.cos(angle), y + radius * Math.sin(angle));
        }
        context.closePath();
        context.fill();
    }

    function drawShapeCtx(context, type, color, x, y) {
        context.fillStyle = color;
        const size = SHAPE_SIZE;
        
        if (type === "square") {
            context.fillRect(x - size/2, y - size/2, size, size);
        } else if (type === "rectangle") {
            context.fillRect(x - (size*0.75), y - (size*0.45), size*1.5, size*0.9);
        } else if (type === "circle") {
            context.beginPath();
            context.arc(x, y, size/2, 0, Math.PI * 2);
            context.fill();
        } else if (type === "triangle") {
            // Re-centered to true X/Y coordinates
            drawPolygonCtx(context, x, y, size/1.6, 3);
        } else if (type === "pentagon") {
            drawPolygonCtx(context, x, y, size/1.75, 5);
        } else if (type === "octagon") {
            let r = size / 1.5; 
            context.beginPath();
            context.moveTo(x, y - r);
            context.lineTo(x + r*0.866, y + r*0.5);
            context.lineTo(x - r*0.866, y + r*0.5);
            context.closePath();
            context.fill();

            context.beginPath();
            context.moveTo(x, y + r);
            context.lineTo(x + r*0.866, y - r*0.5);
            context.lineTo(x - r*0.866, y - r*0.5);
            context.closePath();
            context.fill();
        }
    }

    function drawShape(type, color, x, y) {
        drawShapeCtx(ctx, type, color, x, y);
    }

    function drawTargetUI(target, canvasId) {
        const tCanvas = document.getElementById(canvasId);
        const tCtx = tCanvas.getContext("2d");
        tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);
        
        const cx = tCanvas.width / 2;
        const cy = tCanvas.height / 2;

        if (target.found) {
            let haloRadius = (SHAPE_SIZE / 2) * 2; // Configurable separate size
            tCtx.beginPath();
            tCtx.arc(cx, cy, haloRadius, 0, Math.PI*2); 
            tCtx.fillStyle = "rgba(76, 175, 80, 0.4)";
            tCtx.fill();
            tCtx.strokeStyle = "#4CAF50";
            tCtx.lineWidth = 4;
            tCtx.stroke();
        }
        drawShapeCtx(tCtx, target.shape, target.color, cx, cy);
    }

    function createExplosion(x, y) {
        let explColors = ['#FF0000', '#00FF00', '#0000FF', '#FFFF00', '#FF00FF', '#00FFFF'];
        for(let i=0; i<30; i++) {
            particles.push({
                x: x, y: y,
                vx: (Math.random()-0.5)*12,
                vy: (Math.random()-0.5)*12,
                life: 1,
                color: explColors[Math.floor(Math.random()*explColors.length)]
            });
        }
    }

    // --- GRID GENERATION ---
    function getRandomCombo(excludeIndex) {
        let usedCombos = activeItems
            .filter((item, idx) => idx !== excludeIndex && item.shape && item.color)
            .map(item => item.shape + item.color);
            
        let availableCombos = allCombos.filter(c => !usedCombos.includes(c.shape + c.color));
        return availableCombos[Math.floor(Math.random() * availableCombos.length)];
    }

    function getValidPosition(excludeIndex) {
        let attempts = 0;
        let currentMinDist = 200; 
        
        let rxRange = Math.max(10, canvas.width - SHAPE_SIZE * 3);
        let ryRange = Math.max(10, FIELD_MAX_Y - FIELD_MIN_Y - SHAPE_SIZE * 3);
        
        while (attempts < 250) {
            if (attempts > 50) currentMinDist *= 0.95; 
            
            let rx = (SHAPE_SIZE * 1.5) + Math.random() * rxRange;
            let ry = FIELD_MIN_Y + (SHAPE_SIZE * 1.5) + Math.random() * ryRange;
            
            let overlap = false;
            for (let i = 0; i < activeItems.length; i++) {
                if (i === excludeIndex) continue; 
                if (!activeItems[i].x) continue;  
                
                let dx = rx - activeItems[i].x;
                let dy = ry - activeItems[i].y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < currentMinDist) {
                    overlap = true;
                    break;
                }
            }
            if (!overlap) return {x: rx, y: ry};
            attempts++;
        }
        return {x: canvas.width/2, y: FIELD_MIN_Y + 100}; 
    }

    // --- CLICK EVENTS (Now pointerdown for universal touch/mouse support) ---
    canvas.addEventListener('pointerdown', function(event) {
        initAudio();
        const rect = canvas.getBoundingClientRect();
        const clickX = (event.clientX - rect.left) * (canvas.width / rect.width);
        const clickY = (event.clientY - rect.top) * (canvas.height / rect.height);

        // Instantly generate visual crosshair feedback, regardless of game state
        clickEffects.push({
            x: clickX,
            y: clickY,
            timeCreated: performance.now()
        });

        if (gameState !== 'PLAYING' || celebrating) return; 

        let hitCorrect = false;
        
        // Hitbox multiplier increased to 2
        const hitBoxRadius = (SHAPE_SIZE / 2) * 2;

        for (let i = 0; i < activeItems.length; i++) {
            let item = activeItems[i];
            let dx = clickX - item.x;
            let dy = clickY - item.y;
            
            if (Math.sqrt(dx*dx + dy*dy) <= hitBoxRadius) {
                if (!target1.found && item.shape === target1.shape && item.color === target1.color) {
                    target1.found = true;
                    item.found = true;
                    hitCorrect = true;
                }
                else if (!target2.found && item.shape === target2.shape && item.color === target2.color) {
                    target2.found = true;
                    item.found = true;
                    hitCorrect = true;
                }
                break; 
            }
        }

        if (hitCorrect) {
            if (target1.found && target2.found) {
                if (levelScore >= levelTarget) {
                    levelScore += 2;
                } else {
                    levelScore += 1;
                }
                document.getElementById('scoreDisplay').innerHTML = overallScore + levelScore;
                
                playSound('win'); 
                celebrating = true;
                
                setTimeout(() => {
                    forceTargetReset = true; 
                    celebrating = false;
                    activeItems.forEach(item => item.found = false); 
                }, 500); 
            } else {
                playSound('positive'); 
            }
        } else {
            playSound('negative'); 
        }
    });

    // --- MAIN ANIMATION LOOP ---
    function animate(timestamp) {
        let deltaTime = timestamp - lastRealTime;
        lastRealTime = timestamp;
        
        if (gameState === 'PLAYING') {
            gameTime += deltaTime;
        }

        if (gameState !== 'LEVEL_END_WIN') {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        let speedMultiplier = getSpeedMultiplier();

        if (gameState === 'LEVEL_END_WIN') {
            ctx.fillStyle = "rgba(30, 30, 30, 0.25)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (Math.random() < 0.1) {
                createExplosion(
                    Math.random() * (canvas.width - 100) + 50, 
                    FIELD_MIN_Y + Math.random() * (FIELD_MAX_Y - FIELD_MIN_Y - 50)
                );
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.15; 
                p.life -= 0.02; 
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.globalAlpha = p.life;
                    ctx.fillStyle = p.color;
                    ctx.beginPath(); 
                    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); 
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

        } else if (gameState === 'STOPPED' || gameState === 'LEVEL_END_LOSE') {
            let cols = 8;
            let rows = 6;
            let xSpacing = canvas.width / cols;
            let ySpacing = (FIELD_MAX_Y - FIELD_MIN_Y) / rows;

            for (let i = 0; i < allCombos.length; i++) {
                let col = i % cols;
                let row = Math.floor(i / cols);
                let cx = (xSpacing / 2) + col * xSpacing;
                let cy = FIELD_MIN_Y + (ySpacing / 2) + row * ySpacing;
                drawShape(allCombos[i].shape, allCombos[i].color, cx, cy);
            }

        } else {
            // PLAYING or PAUSED state
            if (gameState === 'PLAYING' && (gameTime > targetsTimeToUpdate || forceTargetReset)) {
                forceTargetReset = false;
                activeItems.forEach(item => item.found = false);
                
                let idx1, idx2;
                let isDuplicate = true;
                
                while (isDuplicate) {
                    idx1 = Math.floor(Math.random() * NUM_SHAPES);
                    idx2 = Math.floor(Math.random() * NUM_SHAPES);
                    while (idx1 === idx2) {
                        idx2 = Math.floor(Math.random() * NUM_SHAPES);
                    }
                    
                    let c1 = activeItems[idx1].shape + activeItems[idx1].color;
                    let c2 = activeItems[idx2].shape + activeItems[idx2].color;
                    
                    if (c1 !== lastTarget1Combo && c1 !== lastTarget2Combo && 
                        c2 !== lastTarget1Combo && c2 !== lastTarget2Combo) {
                        isDuplicate = false;
                        lastTarget1Combo = c1;
                        lastTarget2Combo = c2;
                    }
                }

                target1 = { shape: activeItems[idx1].shape, color: activeItems[idx1].color, found: false };
                target2 = { shape: activeItems[idx2].shape, color: activeItems[idx2].color, found: false };

                let finalDuration = LEVEL_DURATIONS_MS[currentLevel - 1];
                targetsTimeToUpdate = gameTime + finalDuration;

                activeItems[idx1].timeToUpdate = gameTime + finalDuration + 500;
                activeItems[idx2].timeToUpdate = gameTime + finalDuration + 500;
            }

            for (let i = 0; i < activeItems.length; i++) {
                let item = activeItems[i];
                
                if (gameState === 'PLAYING' && !celebrating && gameTime > item.timeToUpdate && !item.found) {
                    let newCombo = getRandomCombo(i);
                    let newPos = getValidPosition(i);
                    
                    item.shape = newCombo.shape;
                    item.color = newCombo.color;
                    item.x = newPos.x;
                    item.y = newPos.y;
                    
                    let baseJumpDelay = 1000 + Math.random() * 2000;
                    item.timeToUpdate = gameTime + (baseJumpDelay * speedMultiplier);
                }
                
                if (!item.found) {
                    drawShape(item.shape, item.color, item.x, item.y);
                }
            }

            for (let i = 0; i < activeItems.length; i++) {
                let item = activeItems[i];
                if (item.found) {
                    let haloRadius = (SHAPE_SIZE / 2) * 2; // Configurable separate size
                    ctx.beginPath();
                    ctx.arc(item.x, item.y, haloRadius, 0, Math.PI*2);
                    ctx.fillStyle = "rgba(76, 175, 80, 0.4)";
                    ctx.fill();
                    ctx.strokeStyle = "#4CAF50";
                    ctx.lineWidth = 4;
                    ctx.stroke();
                    drawShape(item.shape, item.color, item.x, item.y);
                }
            }
        }
        
        // --- DRAW CROSSHAIR & FINGER TOUCH AREA CLICK EFFECTS ---
        for (let i = clickEffects.length - 1; i >= 0; i--) {
            let effect = clickEffects[i];
            let age = timestamp - effect.timeCreated;
            let duration = 1000; // Lives for 1 second
            
            if (age >= duration) {
                clickEffects.splice(i, 1);
            } else {
                ctx.save();
                ctx.globalAlpha = 1 - (age / duration); // Slowly fades out
                
                // Draw the Finger Touch Area (Transparent Circle)
                ctx.beginPath();
                ctx.arc(effect.x, effect.y, 35, 0, Math.PI * 2); // 35px radius representing a finger size
                ctx.fillStyle = "rgba(255, 255, 255, 0.2)";
                ctx.fill();
                ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                ctx.lineWidth = 2;
                ctx.stroke();

                // Draw the Crosshair on top
                ctx.strokeStyle = "#FFFFFF";
                ctx.lineWidth = 4;
                ctx.shadowColor = "#000000"; // Dropshadow for contrast against light shapes
                ctx.shadowBlur = 4;
                
                ctx.beginPath();
                ctx.moveTo(effect.x - 15, effect.y);
                ctx.lineTo(effect.x + 15, effect.y);
                ctx.moveTo(effect.x, effect.y - 15);
                ctx.lineTo(effect.x, effect.y + 15);
                ctx.stroke();
                
                ctx.restore();
            }
        }

        drawTargetUI(target1, "t1Canvas");
        drawTargetUI(target2, "t2Canvas");

        requestAnimationFrame(animate);
    }

    calculateLevelTarget();
    requestAnimationFrame(animate);
  </script>
</body>
