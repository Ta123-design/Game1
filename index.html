<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Disables double-tap zoom and scaling on iOS -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shape Hunter Match</title>
  <style>
    body { 
        font-family: sans-serif; 
        text-align: center; 
        color: #333; 
        background-color: #f8f9fa;
        margin: 0;
        padding-top: 15px;
        overscroll-behavior-y: contain; /* Prevents pull-to-refresh */
    }
    h2 { margin: 5px 0; font-size: 32px; }
    .instructions { font-size: 18px; margin-bottom: 10px; color: #666; }
    
    /* Applies touch optimizations ONLY to the game area so Safari doesn't lock */
    #gameContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        padding: 0 10px;
        box-sizing: border-box;
    }

    #controlsBox {
        background-color: #333;
        color: white;
        padding: 20px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-bottom: 15px;
        box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        width: 100%;
        max-width: 960px; 
        box-sizing: border-box;
    }

    .top-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-end; 
        width: 100%;
        flex-wrap: wrap;
        gap: 15px;
    }

    .bottom-row {
        display: flex;
        justify-content: space-around;
        align-items: center;
        background-color: #222;
        padding: 15px;
        border-radius: 8px;
        font-size: 24px;
        font-weight: bold;
        box-shadow: inset 0px 2px 5px rgba(0,0,0,0.5);
        flex-wrap: wrap;
        gap: 10px;
    }

    .control-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
    }

    .btn-row {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .label {
        font-size: 16px;
        color: #aaa;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    #canvasWrapper {
        resize: both;
        overflow: hidden;
        width: 100%;
        max-width: 960px;
        height: 75vh; /* Responsive height for mobile */
        min-width: 300px; 
        min-height: 400px;
        box-shadow: 0px 4px 15px rgba(0,0,0,0.3);
        border-radius: 8px;
        background-color: #1e1e1e;
        position: relative;
        margin-bottom: 30px;
    }

    #shapeCanvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
      touch-action: none; /* CRITICAL: Stops swipe/scroll gestures on the canvas */
    }

    /* BUTTON TOUCH OPTIMIZATIONS */
    button {
      touch-action: manipulation; /* Removes 300ms tap delay natively */
      cursor: pointer;
    }

    .level-btn {
      background-color: #555;
      color: white;
      border: none;
      border-radius: 6px;
      width: 45px;  
      height: 45px; 
      font-size: 30px; 
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .level-btn:hover { background-color: #777; }
    .level-btn:active { background-color: #999; }

    .action-btn {
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 12px 24px; 
      font-size: 24px;    
      font-weight: bold;
    }
    
    .action-btn:hover { background-color: #45a049; }

    .reset-btn { background-color: #E53935; }
    .reset-btn:hover { background-color: #d32f2f; }
    
    /* Mobile adjustments for text sizes */
    @media (max-width: 600px) {
        .bottom-row { font-size: 18px; }
        .action-btn { font-size: 18px; padding: 10px 16px; }
        .level-btn { width: 35px; height: 35px; font-size: 24px; }
    }
  </style>
</head>
<body>
  <h2>Shape Hunter Match</h2>
  <div class="instructions">
    Look at the <strong>2 Targets at the top</strong>. Click their matches in the moving field below!
  </div>
  
  <div id="gameContainer">
    <div id="controlsBox">
      
      <!-- TOP ROW: Controls -->
      <div class="top-row">
        <div class="control-group">
          <div class="btn-row">
            <button id="actionBtn" class="action-btn" onclick="togglePlayPause()">Start</button>
            <button class="action-btn reset-btn" onclick="handleStopClick()">Stop</button>
          </div>
        </div>

        <div class="control-group">
          <div class="label">Level</div>
          <div class="btn-row">
            <button class="level-btn" onclick="changeLevel(-1)">-</button>
            <span id="levelDisplay" style="min-width: 35px; text-align: center; font-size: 28px; font-weight: bold;">1</span>
            <button class="level-btn" onclick="changeLevel(1)">+</button>
          </div>
        </div>

        <div class="control-group">
          <div class="label">Time Setup</div>
          <div class="btn-row">
            <button class="level-btn" onclick="changeTimeSetting(-10)">-</button>
            <span id="timeSettingDisplay" style="min-width: 45px; text-align: center; font-size: 28px; font-weight: bold;">30</span>
            <button class="level-btn" onclick="changeTimeSetting(10)">+</button>
          </div>
        </div>
      </div>

      <!-- BOTTOM ROW: Stats -->
      <div class="bottom-row">
        <div>Score: <span id="scoreDisplay" style="color: #4CAF50;">0</span></div>
        <div>Time Left: <span id="timeDisplay" style="color: #FFD700;">30</span></div>
        <div>Target: <span id="targetDisplay" style="color: #00BFFF;">0</span></div>
      </div>

    </div>

    <!-- The Resizable container -->
    <div id="canvasWrapper">
        <canvas id="shapeCanvas"></canvas>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("shapeCanvas");
    const ctx = canvas.getContext("2d");
    const canvasWrapper = document.getElementById("canvasWrapper");
    const controlsBox = document.getElementById("controlsBox");

    const colors = [
        "#007AFF", "#FF0000", "#FFFF00", "#34C759", 
        "#8B4513", "#FFA500", "#9C27B0", "#FFFFFF"
    ];
    
    const shapes = ["square", "rectangle", "triangle", "octagon", "hexagon", "circle"];
    
    const allCombos = [];
    for (let s of shapes) {
        for (let c of colors) {
            allCombos.push({shape: s, color: c});
        }
    }

    const NUM_SHAPES = 12; 
    const SHAPE_SIZE = 66; 
    const FIELD_MIN_Y = 180;
    
    let FIELD_MAX_Y = 1160 - SHAPE_SIZE; 

    let activeItems = [];
    let score = 0;
    let currentLevel = 1; 
    
    let levelScore = 0;
    let levelTarget = 0;

    let target1 = {shape: allCombos[0].shape, color: allCombos[0].color, found: false};
    let target2 = {shape: allCombos[1].shape, color: allCombos[1].color, found: false};
    let targetsTimeToUpdate = 0;
    let forceTargetReset = true;
    let celebrating = false; 

    let gameState = 'STOPPED';
    let lastRealTime = 0;
    let gameTime = 0; 
    
    let timeSetting = 30; 
    let timeLeft = 30;    
    let timeInterval = null;

    // --- SAFARI FIX: requestAnimationFrame inside ResizeObserver ---
    // This completely prevents the "ResizeObserver loop limit exceeded" crash on iOS
    const resizeObserver = new ResizeObserver(entries => {
        window.requestAnimationFrame(() => {
            if (!entries || entries.length === 0) return;
            const entry = entries[0];
            const newWidth = entry.contentRect.width;
            const newHeight = entry.contentRect.height;
            
            if (newWidth > 0 && newHeight > 0) {
                canvas.width = newWidth;
                canvas.height = newHeight;
                FIELD_MAX_Y = newHeight - SHAPE_SIZE;
                
                if (window.innerWidth > 960) {
                    controlsBox.style.width = newWidth + "px";
                } else {
                    controlsBox.style.width = "100%";
                }
            }
        });
    });
    resizeObserver.observe(canvasWrapper);

    let audioCtx;
    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        initAudio();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'positive') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); 
            oscillator.frequency.setValueAtTime(1108.73, audioCtx.currentTime + 0.05); 
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.15);
            
        } else if (type === 'win') {
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); 
            oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1); 
            oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2); 
            oscillator.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.3); 

            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.6);

        } else if (type === 'negative') {
            oscillator.type = 'sawtooth';
            oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
            oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.2);
            
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.2);
            
        } else if (type === 'timeout_win') {
            oscillator.type = 'triangle';
            oscillator.frequency.setValueAtTime(392.00, audioCtx.currentTime);       
            oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime + 0.1); 
            oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2); 
            oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.3); 
            oscillator.frequency.setValueAtTime(1046.50, audioCtx.currentTime + 0.4);

            gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
            
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + 0.8);
        }
    }

    function calculateLevelTarget() {
        let speedMultiplier = getSpeedMultiplier();
        let avgDuration = 3250 * speedMultiplier; 
        let theoreticalMax = (timeSetting * 1000) / avgDuration;
        levelTarget = Math.max(1, Math.floor(theoreticalMax * 0.8));
        document.getElementById('targetDisplay').innerText = levelTarget;
    }

    function togglePlayPause() {
        const btn = document.getElementById("actionBtn");
        
        if (gameState === 'STOPPED') {
            gameState = 'PLAYING';
            score = 0;
            levelScore = 0;
            document.getElementById('scoreDisplay').innerText = score;
            timeLeft = timeSetting;
            document.getElementById('timeDisplay').innerText = timeLeft;
            forceTargetReset = true;
            
            calculateLevelTarget();
            
            activeItems = [];
            for (let i = 0; i < NUM_SHAPES; i++) {
                let combo = getRandomCombo(i);
                let pos = getValidPosition(i);
                activeItems.push({
                    shape: combo.shape,
                    color: combo.color,
                    x: pos.x,
                    y: pos.y,
                    timeToUpdate: gameTime + (Math.random() * 2000),
                    found: false
                });
            }
            
            btn.innerText = "Pause";
            btn.style.backgroundColor = "#ff9800"; 
            initAudio();
            startTimer();
            
        } else if (gameState === 'PLAYING') {
            gameState = 'PAUSED';
            btn.innerText = "Continue";
            btn.style.backgroundColor = "#4CAF50"; 
            clearInterval(timeInterval);
            
        } else if (gameState === 'PAUSED') {
            gameState = 'PLAYING';
            btn.innerText = "Pause";
            btn.style.backgroundColor = "#ff9800"; 
            startTimer();
        }
    }

    function handleStopClick() {
        currentLevel = 1;
        document.getElementById('levelDisplay').innerText = currentLevel;
        calculateLevelTarget();
        stopGame(false); 
    }

    function stopGame(isTimeout = false) {
        gameState = 'STOPPED';
        clearInterval(timeInterval);
        
        const btn = document.getElementById("actionBtn");
        btn.innerText = "Start";
        btn.style.backgroundColor = "#4CAF50"; 
        
        timeLeft = timeSetting;
        document.getElementById('timeDisplay').innerText = timeLeft;
        activeItems = []; 
        
        if (isTimeout && score > 0) {
            playSound('timeout_win'); 
        }
    }

    function startTimer() {
        clearInterval(timeInterval);
        timeInterval = setInterval(() => {
            if(gameState !== 'PLAYING') return;
            timeLeft--;
            document.getElementById('timeDisplay').innerText = timeLeft;
            if (timeLeft <= 0) {
                stopGame(true); 
            }
        }, 1000);
    }

    function changeTimeSetting(diff) {
        if (gameState !== 'STOPPED') return; 
        timeSetting += diff;
        if (timeSetting < 10) timeSetting = 120; 
        if (timeSetting > 120) timeSetting = 10;
        document.getElementById("timeSettingDisplay").innerText = timeSetting;
        
        timeLeft = timeSetting;
        document.getElementById("timeDisplay").innerText = timeLeft;
        calculateLevelTarget(); 
    }

    function changeLevel(change) {
        if (gameState !== 'STOPPED') return; 
        currentLevel += change;
        if (currentLevel < 1) currentLevel = 10;
        if (currentLevel > 10) currentLevel = 1;
        document.getElementById("levelDisplay").innerText = currentLevel;
        calculateLevelTarget(); 
    }

    function getSpeedMultiplier() {
        if (currentLevel === 5) return 1.0;
        if (currentLevel > 5) return Math.pow(0.85, currentLevel - 5);
        else return Math.pow(1.15, 5 - currentLevel);
    }

    function drawPolygon(ctx, x, y, radius, sides) {
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
            const angle = i * 2 * Math.PI / sides - Math.PI / 2; 
            ctx.lineTo(x + radius * Math.cos(angle), y + radius * Math.sin(angle));
        }
        ctx.closePath();
        ctx.fill();
    }

    function drawShape(type, color, x, y) {
        ctx.fillStyle = color;
        const size = SHAPE_SIZE;
        
        if (type === "square") {
            ctx.fillRect(x - size/2, y - size/2, size, size);
        } else if (type === "rectangle") {
            ctx.fillRect(x - (size*0.75), y - (size*0.45), size*1.5, size*0.9);
        } else if (type === "circle") {
            ctx.beginPath();
            ctx.arc(x, y, size/2, 0, Math.PI * 2);
            ctx.fill();
        } else if (type === "triangle") {
            drawPolygon(ctx, x, y + size/6, size/1.6, 3);
        } else if (type === "hexagon") {
            drawPolygon(ctx, x, y, size/1.75, 6);
        } else if (type === "octagon") {
            let r = size / 1.5; 
            ctx.beginPath();
            ctx.moveTo(x, y - r);
            ctx.lineTo(x + r*0.866, y + r*0.5);
            ctx.lineTo(x - r*0.866, y + r*0.5);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(x, y + r);
            ctx.lineTo(x + r*0.866, y - r*0.5);
            ctx.lineTo(x - r*0.866, y - r*0.5);
            ctx.closePath();
            ctx.fill();
        }
    }

    function getRandomCombo(excludeIndex) {
        let usedCombos = activeItems
            .filter((item, idx) => idx !== excludeIndex && item.shape && item.color)
            .map(item => item.shape + item.color);
            
        let availableCombos = allCombos.filter(c => !usedCombos.includes(c.shape + c.color));
        return availableCombos[Math.floor(Math.random() * availableCombos.length)];
    }

    function getValidPosition(excludeIndex) {
        let attempts = 0;
        let currentMinDist = Math.min(200, canvas.width / 2.5); 
        
        let rxRange = Math.max(10, canvas.width - SHAPE_SIZE * 3);
        let ryRange = Math.max(10, FIELD_MAX_Y - FIELD_MIN_Y - SHAPE_SIZE * 3);
        
        while (attempts < 250) {
            if (attempts > 50) currentMinDist *= 0.95; 
            
            let rx = (SHAPE_SIZE * 1.5) + Math.random() * rxRange;
            let ry = FIELD_MIN_Y + (SHAPE_SIZE * 1.5) + Math.random() * ryRange;
            
            let overlap = false;
            for (let i = 0; i < activeItems.length; i++) {
                if (i === excludeIndex) continue; 
                if (!activeItems[i].x) continue;  
                
                let dx = rx - activeItems[i].x;
                let dy = ry - activeItems[i].y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < currentMinDist) {
                    overlap = true;
                    break;
                }
            }
            if (!overlap) return {x: rx, y: ry};
            attempts++;
        }
        return {x: canvas.width/2, y: FIELD_MIN_Y + 100}; 
    }

    // --- UNIFIED TOUCH & MOUSE HANDLER ---
    function handleTap(event) {
        if (event.type === 'touchstart') {
            event.preventDefault();
        }

        if (gameState !== 'PLAYING' || celebrating) return; 

        initAudio();
        const rect = canvas.getBoundingClientRect();
        
        let clientX, clientY;
        if (event.touches && event.touches.length > 0) {
            clientX = event.touches[0].clientX;
            clientY = event.touches[0].clientY;
        } else {
            clientX = event.clientX;
            clientY = event.clientY;
        }

        const clickX = (clientX - rect.left) * (canvas.width / rect.width);
        const clickY = (clientY - rect.top) * (canvas.height / rect.height);

        let hitCorrect = false;

        for (let i = 0; i < activeItems.length; i++) {
            let item = activeItems[i];
            let dx = clickX - item.x;
            let dy = clickY - item.y;
            
            if (Math.sqrt(dx*dx + dy*dy) <= SHAPE_SIZE / 2) {
                if (!target1.found && item.shape === target1.shape && item.color === target1.color) {
                    target1.found = true;
                    item.found = true;
                    hitCorrect = true;
                }
                else if (!target2.found && item.shape === target2.shape && item.color === target2.color) {
                    target2.found = true;
                    item.found = true;
                    hitCorrect = true;
                }
                break; 
            }
        }

        if (target1.found && target2.found) {
            score++;
            levelScore++;
            document.getElementById('scoreDisplay').innerHTML = score;
            
            if (levelScore >= levelTarget) {
                playSound('timeout_win'); 
                celebrating = true;
                
                setTimeout(() => {
                    currentLevel++;
                    if (currentLevel > 10) {
                        alert("Congratulations! You beat all 10 levels!");
                        handleStopClick();
                        return;
                    }
                    
                    levelScore = 0;
                    timeLeft = timeSetting;
                    document.getElementById('levelDisplay').innerText = currentLevel;
                    document.getElementById('timeDisplay').innerText = timeLeft;
                    calculateLevelTarget();
                    
                    gameState = 'STOPPED';
                    clearInterval(timeInterval);
